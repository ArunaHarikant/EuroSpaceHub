# Render Blueprint — a free way to get this running.
#
# On render.com: New → Blueprint → connect this repo. Render reads this file,
# builds the Dockerfile, and runs it. No credit card is required for a free web
# service. Secret env vars (sync: false) are entered in the Render dashboard.
#
# ⚠️ DATA DURABILITY: the free instance has an EPHEMERAL filesystem — the SQLite
# database is wiped on every restart, redeploy, or idle spin-down. That is fine
# to SHOW the app working; it is not fine for keeping real reports. Two ways to
# make data durable (see DEPLOY.md):
#   - add a persistent disk  (Render paid instance), or
#   - replicate SQLite to your B2 bucket with Litestream  (free — ask me to wire
#     it in).
services:
  - type: web
    name: eurospacehub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE           # the session cookie MUST be Secure in production
        value: "true"
      - key: TRUST_PROXY             # Render terminates TLS at a proxy
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: DB_PATH
        value: /data/hub.db
      # ---- secrets: enter these in the Render dashboard, not here ----
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: SEED_SUPERVISOR_EMAIL
        sync: false
