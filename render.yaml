# Render Blueprint — a free way to get this running.
#
# On render.com: New → Blueprint → connect this repo. Render reads this file,
# builds the Dockerfile, and runs it on the free plan (no credit card needed).
#
# This gets the whole app working EXCEPT file attachments, which need Backblaze
# B2. B2 is intentionally left out here so the first deploy is simple; add the
# five B2_* vars later (see DEPLOY.md) to turn on uploads.
#
# ⚠️ On the free plan the disk is EPHEMERAL: the database resets on every
# restart / redeploy / idle spin-down. Fine to get it live; ask the developer to
# add Litestream (free) or a paid disk when the data needs to persist.
services:
  - type: web
    name: eurospacehub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE           # the session cookie MUST be Secure in production
        value: "true"
      - key: TRUST_PROXY             # Render terminates TLS at a proxy
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: DB_PATH
        value: /data/hub.db
      - key: SEED_SUPERVISOR_EMAIL   # the professor's login email; set this in the dashboard
        sync: false
      # ---- OPTIONAL: file attachments (add later) ----
      # Set these five in the dashboard to turn on report-file uploads. Until
      # then everything else works and uploads are simply unavailable.
      #   B2_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET_NAME, B2_ENDPOINT, B2_REGION
