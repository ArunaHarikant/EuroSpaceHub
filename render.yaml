# Render Blueprint — a free way to get this running.
#
# On render.com: New → Blueprint → connect this repo. Render reads this file,
# builds the Dockerfile, and runs it on the free plan (no credit card needed).
#
# Two levels, both free:
#
#   1. Deploy with NO B2 vars  → everything works except file attachments, and
#      the database RESETS on restart (free plan has an ephemeral disk). Good for
#      trying it out.
#
#   2. Add the five B2_* vars  → turns on BOTH file attachments AND durable data:
#      Litestream (built into the image) continuously backs the database up to
#      the same B2 bucket and restores it on every boot, so nothing is lost when
#      the free instance restarts. This is the recommended setup for real use.
#
# Backblaze B2 has a free tier, so level 2 is still $0.
services:
  - type: web
    name: eurospacehub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE           # the session cookie MUST be Secure in production
        value: "true"
      - key: TRUST_PROXY             # Render terminates TLS at a proxy
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: DB_PATH
        value: /data/hub.db
      - key: SEED_SUPERVISOR_EMAIL   # the professor's login email; set this in the dashboard
        sync: false
      # ---- Backblaze B2 (recommended): durable data + file attachments ----
      # Set all five in the dashboard to turn on durable storage (Litestream) and
      # report-file uploads at once. Leave them blank for a quick ephemeral demo.
      #   B2_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET_NAME, B2_ENDPOINT, B2_REGION
